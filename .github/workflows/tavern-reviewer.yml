name: Tavern Site Reviewer Agent

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site origin to audit'
        default: 'https://codey.info'
      tavern_url:
        description: 'Persistent Tavern API base URL'
        default: 'https://codey.info/engine'

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Site Reviewer Agent and update tracked GitHub issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_SITE_URL: ${{ inputs.site_url || vars.REVIEW_SITE_URL || 'https://codey.info' }}
          REVIEW_TAVERN_URL: ${{ inputs.tavern_url || vars.TAVERN_URL || 'https://codey.info/engine' }}
        run: node engine/agents/reviewer.mjs --publish-github
