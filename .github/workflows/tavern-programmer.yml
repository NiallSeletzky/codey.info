name: Tavern Programming Proposal Agent

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify repository test health
        run: |
          npm run engine:test
          npm run check
      - name: Generate and publish Programming Agent implementation brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_SITE_URL: ${{ vars.REVIEW_SITE_URL || 'https://codey.info' }}
          REVIEW_TAVERN_URL: ${{ vars.TAVERN_URL || 'https://codey.info/engine' }}
        run: node engine/agents/programmer.mjs --publish-github
