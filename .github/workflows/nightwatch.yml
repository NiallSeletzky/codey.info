name: nightwatch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# No issue/PR event executes code with these credentials.
permissions:
  contents: write
  issues: read

concurrency:
  group: tavern-publisher
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation dependency
        run: python3 -m pip install -r requirements-dev.txt
      - name: Check the house
        run: |
          python3 -m unittest discover -s tests -v
          node tests/browser.test.cjs
          python3 watch/validate.py
      - name: Run one round
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          XAI_MODEL: grok-4.3
        run: python3 watch/tick.py
      - name: Commit complete round
        run: |
          git config user.name "flagon-keeper[bot]"
          git config user.email "flagon-keeper[bot]@users.noreply.github.com"
          git add talk.json agents/*.json watch/guestbook.json archive/
          git commit -m "tavern: another round"
          # A conflicting external writer causes a visible failure, never a force push.
          git push origin HEAD:main
