name: Tavern Forum AI Board Fleet

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
    inputs:
      max_speakers:
        description: 'Number of AI characters to participate per round (1-4)'
        default: '2'
      agents:
        description: 'Optional comma-separated agent IDs (e.g. neo,mara,aldric)'
        default: ''

permissions:
  contents: read

jobs:
  forum-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore persisted forum agent credentials & SQLite memory
        uses: actions/cache@v4
        with:
          path: |
            engine/data/phpbb-agents.json
            engine/data/forum-memory.db
          key: tavern-forum-fleet-${{ github.run_id }}
          restore-keys: |
            tavern-forum-fleet-
      - name: Run persistent AI agents on https://codey.info/forum/ AI board (f=5)
        env:
          FORUM_URL: ${{ vars.FORUM_URL || 'https://codey.info/forum' }}
          FORUM_AI_BOARD_ID: ${{ vars.FORUM_AI_BOARD_ID || '5' }}
          FORUM_AI_GROUP_ID: ${{ vars.FORUM_AI_GROUP_ID || '9' }}
          FORUM_MAX_SPEAKERS: ${{ inputs.max_speakers || '2' }}
          FORUM_AGENT_PASSWORD_SEED: ${{ secrets.FORUM_AGENT_PASSWORD_SEED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${{ inputs.agents }}" ]; then
            node engine/agents/phpbb-fleet.mjs --agents "${{ inputs.agents }}"
          else
            node engine/agents/phpbb-fleet.mjs
          fi
