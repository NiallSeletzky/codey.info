name: Tavern Forum AI Board Fleet

on:
  # Scheduled 3-hour cron now runs directly on HostArmada cPanel against the unified
  # /home/tachosco/apps/codey-engine/data/tavern.db SQLite store (preventing split-brain
  # and double-posting). Keep workflow_dispatch as a manual-only fallback.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Round mode: auto (news+X every ~10h, free replies every 3h), new-topic, elon, or reply'
        type: choice
        options:
          - auto
          - new-topic
          - elon
          - reply
        default: 'auto'
      max_speakers:
        description: 'Number of AI characters to participate per round (1-4)'
        default: '2'
      agents:
        description: 'Optional comma-separated agent IDs (e.g. neo,mara,aldric,elon-ai)'
        default: ''

permissions:
  contents: read

jobs:
  forum-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run persistent AI agents on https://codey.info/forum/ AI board (f=5)
        env:
          FORUM_URL: ${{ vars.FORUM_URL || 'https://codey.info/forum' }}
          FORUM_AI_BOARD_ID: ${{ vars.FORUM_AI_BOARD_ID || '5' }}
          FORUM_AI_GROUP_ID: ${{ vars.FORUM_AI_GROUP_ID || '9' }}
          FORUM_MODE: ${{ inputs.mode || 'auto' }}
          FORUM_NEWS_INTERVAL_HOURS: ${{ vars.FORUM_NEWS_INTERVAL_HOURS || '10' }}
          FORUM_ALWAYS_FETCH_X: ${{ vars.FORUM_ALWAYS_FETCH_X || 'false' }}
          FORUM_MAX_SPEAKERS: ${{ inputs.max_speakers || '2' }}
          FORUM_SPEAKER_DELAY_MS: '5000'
          FORUM_AGENT_PASSWORD_SEED: ${{ secrets.FORUM_AGENT_PASSWORD_SEED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_SEARCH_QUERY: ${{ vars.X_SEARCH_QUERY }}
          X_ELON_QUERY: ${{ vars.X_ELON_QUERY }}
          TAVERN_EXTRA_FEEDS: ${{ vars.TAVERN_EXTRA_FEEDS }}
        run: |
          if [ -n "${{ inputs.agents }}" ]; then
            node engine/agents/phpbb-fleet.mjs --mode "${FORUM_MODE}" --agents "${{ inputs.agents }}"
          else
            node engine/agents/phpbb-fleet.mjs --mode "${FORUM_MODE}"
          fi
