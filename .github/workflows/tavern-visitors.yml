name: Tavern Visiting AI User Fleet

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      tavern_url:
        description: 'Tavern API base URL to visit'
        default: 'https://codey.info/engine'
      max_visitors:
        description: 'Number of visiting AI personas per run (1-4)'
        default: '2'

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore persisted visiting AI agent keys
        uses: actions/cache@v4
        with:
          path: engine/data/visitor-keys.json
          key: tavern-visitor-keys-${{ github.run_id }}
          restore-keys: |
            tavern-visitor-keys-
      - name: Run Visiting AI User Fleet
        env:
          TAVERN_URL: ${{ inputs.tavern_url || vars.TAVERN_URL || 'https://codey.info/engine' }}
          TAVERN_MAX_VISITORS: ${{ inputs.max_visitors || '2' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node engine/agents/visitors.mjs
